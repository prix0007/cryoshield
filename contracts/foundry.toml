[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"

# Pinned compiler. `cancun` is supported by the OP Stack (since Ecotone), Arbitrum (ArbOS >= 20) and Ethereum L1,
# so the same bytecode deploys to both. No chain-specific precompiles are used.
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 10_000
auto_detect_solc = false

# Vendored, pruned Coinbase Smart Wallet v1.1.0 and its dependencies (lib/cbsw-v1.1.0/README.md).
remappings = [
    "forge-std/=lib/forge-std/src/",
    "smart-wallet/=lib/cbsw-v1.1.0/src/",
    "solady/=lib/cbsw-v1.1.0/lib/solady/src/",
    "account-abstraction/=lib/cbsw-v1.1.0/lib/account-abstraction/contracts/",
    "webauthn-sol/=lib/cbsw-v1.1.0/lib/webauthn-sol/src/",
    "FreshCryptoLib/=lib/cbsw-v1.1.0/lib/webauthn-sol/lib/FreshCryptoLib/solidity/src/",
    "openzeppelin-contracts/=lib/cbsw-v1.1.0/lib/openzeppelin-contracts/",
]

# The static immutability check (test/Immutability.t.sol) reads the contract source.
fs_permissions = [{ access = "read", path = "./src" }, { access = "read", path = "./test/fixtures" }, { access = "read", path = "./deployments" }, { access = "read", path = "./lib/cbsw-v1.1.0/src" }, { access = "read", path = "../packages/vault-crypto/test-vectors" }]

[fuzz]
runs = 1_000

[invariant]
runs = 256
depth = 200
fail_on_revert = false

# Mainnet-equivalent EVM settings (task 6.2): same compiler and bytecode,
# chain id 1 and an L1-sized block gas limit.
[profile.mainnet]
chain_id = 1
gas_limit = 36_000_000
block_base_fee_per_gas = 1_000_000_000

[fmt]
line_length = 120

# Network presets (parity with script/deploy.sh and config/chain-presets.json).
# Testnet: op_sepolia. Mainnet chain TBD (op_mainnet or arbitrum_one).
[rpc_endpoints]
anvil = "http://127.0.0.1:8545"
op_sepolia = "${OP_SEPOLIA_RPC_URL}"
op_mainnet = "${OP_MAINNET_RPC_URL}"
arbitrum_sepolia = "${ARBITRUM_SEPOLIA_RPC_URL}"
arbitrum_one = "${ARBITRUM_ONE_RPC_URL}"

# Explorer verification is keyless Blockscout and Sourcify (script/deploy.sh). No [etherscan] table: the pinned forge
# 1.1.0 cannot use Etherscan V2, so the optional Etherscan step is script/verify-etherscan.sh (curl, key via stdin).

# VaultRegistry v1 is deployed (OP Sepolia 0xB43f58cF17e64B603aE5588a1DD17E96a0849e44) and its CREATE2 address commits to
# its exact bytecode, including the solc metadata hash, which covers the remappings. This profile reproduces the
# original v1 build (only the forge-std remapping, no CBSW sources) so script/deploy.sh can predict, verify and (on
# anvil) deploy v1 byte-for-byte. Never use it for anything but VaultRegistry v1.
[profile.v1]
out = "out-v1"
cache_path = "cache-v1"
auto_detect_remappings = false
remappings = ["forge-std/=lib/forge-std/src/"]
skip = ["src/CryoShield*.sol", "src/*VaultRegistryV2.sol", "test/**", "script/DeployV2.s.sol"]
