[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"

# Pinned compiler. `cancun` is supported by the OP Stack (since Ecotone), Arbitrum (ArbOS >= 20) and Ethereum L1,
# so the same bytecode deploys to both. No chain-specific precompiles are used.
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 10_000
auto_detect_solc = false

# The static immutability check (test/Immutability.t.sol) reads the contract source.
fs_permissions = [{ access = "read", path = "./src" }, { access = "read", path = "./test/fixtures" }, { access = "read", path = "./lib/smart-wallet/src" }]

[fuzz]
runs = 1_000

[invariant]
runs = 256
depth = 200
fail_on_revert = false

# Mainnet-equivalent EVM settings (task 6.2): same compiler and bytecode,
# chain id 1 and an L1-sized block gas limit.
[profile.mainnet]
chain_id = 1
gas_limit = 36_000_000
block_base_fee_per_gas = 1_000_000_000

[fmt]
line_length = 120

# Network presets (parity with script/deploy.sh and config/chain-presets.json).
# Testnet: op_sepolia. Mainnet chain TBD (op_mainnet or arbitrum_one).
[rpc_endpoints]
anvil = "http://127.0.0.1:8545"
op_sepolia = "${OP_SEPOLIA_RPC_URL}"
op_mainnet = "${OP_MAINNET_RPC_URL}"
arbitrum_sepolia = "${ARBITRUM_SEPOLIA_RPC_URL}"
arbitrum_one = "${ARBITRUM_ONE_RPC_URL}"

# Explorer verification is keyless Blockscout (script/deploy.sh passes --verifier blockscout --verifier-url per preset).
# No [etherscan] table: the pinned forge 1.1.0 cannot use Etherscan V2 (post-MVP, after a forge bump).
