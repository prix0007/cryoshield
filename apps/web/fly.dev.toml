# Fly.io config for the DEVELOPMENT site https://dev.cryoshield.app (split-dev-and-release-deploys D2).
# Same image, build and health check as production (fly.toml); only the app differs. Every main commit deploys here
# (.github/workflows/deploy-dev.yml). The build it serves uses RP ID dev.cryoshield.app and sends noindex headers.
# No [env], no secrets, no [mounts]: the image only contains the verified static build.
# Created once: fly apps create cryoshield-web-dev --org cryoshield
app = "cryoshield-web-dev"
primary_region = "sin" # Singapore, as production.

[build]
  dockerfile = "deploy/Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0 # scale to zero when idle; a dev site is idle most of the time
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = "5s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
