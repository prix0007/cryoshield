schema: spec-driven

# Product source of truth: .claude/PRPs/prds/cryoshield.prd.md
context: |
  CryoShield: non-custodial, permanent backup of small secrets (seed phrases, 2FA/recovery codes),
  unlocked only by FIDO2 hardware keys (YubiKey 5, firmware >= 5.2) via the WebAuthn PRF extension.
  Hard constraints (not inferable from code):
  - OpenSpec is mandatory: every feature, fix, and refactor starts as an OpenSpec change. No code without an approved change.
  - No CryoShield backend. Allowed runtime pieces: a static frontend, public chain RPCs, a third-party
    ERC-4337 bundler/paymaster (CryoShield sponsors gas), and Arweave. Never add a server we operate.
  - CryoShield never sees plaintext or key material; all encryption happens client-side.
  - Crypto is symmetric only: PRF -> HKDF-SHA256 -> AES-256-GCM key wrapping. No ECIES/RSA/ECDH for vault data
    (public ciphertext must stay quantum-safe forever).
  - Any single enrolled key unlocks a vault (1-of-N, N >= 2 at creation); the vault format must also support
    Shamir M-of-N.
  - Recovery must work without CryoShield: an open-source desktop tool (CTAP2 hmac-secret) reads the vault
    from public RPCs/Arweave. Vault format records RP ID, PRF salts, credential IDs, and algorithm IDs.
  - Chain: Arbitrum One first (Solidity, Foundry); contracts must stay portable to Ethereum L1. Vault blob <= 1 KB.
  - Fully open source. No external audit for the MVP, so rely on audited libraries (WebCrypto, @noble/*),
    a published spec, and deterministic test vectors.
  - Targets non-technical users: users never handle gas, seed phrases, or wallets in the default flow.

rules:
  proposal:
    - State explicitly what is out of scope
    - State whether the change adds any runtime dependency, and confirm it is not a CryoShield-operated backend
  specs:
    - Use SHALL/MUST wording and at least one WHEN/THEN scenario per requirement
    - Crypto and on-chain format requirements must reference test vectors
  design:
    - Include a threat/abuse section for any change touching crypto, contracts, or the paymaster
  tasks:
    - Write tests first (TDD); each task lists the test that proves it
    - Any change touching crypto, contracts, or the paymaster ends with a security-review task
