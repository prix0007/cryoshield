# PRODUCTION deployment of https://cryoshield.app (Fly app cryoshield-web) from owner-published releases ONLY.
# OpenSpec changes add-continuous-deploy, gate-production-deploys, deploy-skip-when-unconfigured,
# split-dev-and-release-deploys. Every main commit goes to the development site instead (deploy-dev.yml).
#
#   detect (owner only; resolve the v* tag to its commit, which must be reachable from main; summarise the diff)
#   -> config (env production-build: is the build config there? if not, warn and skip the rest successfully)
#   -> test (FULL ci.yml on the tagged commit) -> build (env production-build: DEPLOY_TARGET=production
#   deploy.sh --build-only, no Fly token) -> release (env production: tag re-check, deploy + smoke test + automatic
#   rollback, all in one job)
#
# Triggers: a GitHub Release published for a v* tag (gh release create vX.Y.Z --target main --generate-notes), and
# workflow_dispatch AT a v* tag ref (redeploy or roll back: gh workflow run deploy.yml --ref vX.Y.Z). The tag is always
# the run's own ref (github.ref_name), never an input, so the workflow file, the tested code and the deployed code all
# come from the admin-created tag. Never on push, schedule or pull requests (enforced by workflow-policy.mjs).
#
# Who can deploy: only the repository owner. Three independent layers (design decision 4):
#   1. the `release-tags` ruleset (.github/rulesets/release-tags.json): only admins may create, move or delete v* tags;
#   2. the first job runs only when github.triggering_actor is the repository owner (covers a release published on an
#      existing tag, a dispatch, or a re-run by anyone else);
#   3. `production` and `production-build` accept ONLY v* tags as deployment refs (no branch, not even main), so the
#      only path to production secrets is a tag that only an admin can create.
#
# Concurrency: none at the workflow level, so a run started by anyone else (skipped at once by the owner gate) can never
# hold or replace a group the owner's run needs; detect/config/build use per-run groups (github.run_id), shared with no
# other run. `deploy-production` on the release job only, reached only after the owner gate, never cancelled (one
# release at a time, never cut mid-deploy). Separate from the development groups.
#
# Credentials: FLY_API_TOKEN (Fly deploy token scoped to cryoshield-web) lives only in the GitHub Environment
# `production` (v* tags only, no reviewer: the owner's release is the human step) and is used only by the `deploy`
# and `rollback` steps of the release job, which runs no node/pnpm or build code. Build config (VITE_* and
# VITE_BUNDLER_URL) lives in `production-build`; it decides the chain (OP Sepolia today, OP Mainnet later), nothing
# here is chain-specific. Runbook: docs/deploy.md.

name: Deploy (production)

on:
  release:
    types: [published]
  workflow_dispatch: # run it AT the tag: gh workflow run deploy.yml --ref vX.Y.Z (no inputs)

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  SITE_URL: https://cryoshield.app
  FLY_APP: cryoshield-web
  FLY_CONFIG: fly.toml
  # flyctl from the GitHub release, verified against flyctl_0.4.111_checksums.txt (2026-10-04).
  FLYCTL_VERSION: "0.4.111"
  FLYCTL_SHA256: 1878d7fb1f8a418039042cf0749e4b7216c6c7018b66ae10611a64c2b6d9aa9e # flyctl_0.4.111_Linux_x86_64.tar.gz

jobs:
  # Fails here, before anything is configured, tested or built, if the tag is malformed, missing, does not match the
  # release event's commit, or is not reachable from main.
  detect:
    name: detect
    if: github.triggering_actor == github.repository_owner && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency: # per run: nothing shared with any other run, so no run can hold or replace it (no workflow-level group)
      group: deploy-production-detect-${{ github.run_id }}
      cancel-in-progress: false
    permissions:
      contents: read # the tag, main's HEAD and the compare API; the deploy scripts
    outputs:
      deploy: ${{ steps.detect.outputs.deploy }}
      sha: ${{ steps.detect.outputs.sha }}
      tag: ${{ steps.detect.outputs.tag }}
    steps:
      - name: Checkout (deploy scripts only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts/deploy
      - name: Resolve the release tag (must be reachable from main)
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # The run's own ref (release event or dispatch, both at refs/tags/v*), so the tag must point at github.sha.
          TAG: ${{ github.ref_name }}
          EXPECT_SHA: ${{ github.sha }}
        run: .github/scripts/deploy/release-ref.sh
      # Informational, never blocks: the diff from the live commit, token-path files flagged, and a warning when the
      # release is not newer than what is live (a rollback).
      - name: Summarise what this release changes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TARGET_SHA: ${{ steps.detect.outputs.sha }}
          BASE_URL: ${{ env.SITE_URL }}
        run: .github/scripts/deploy/release-diff.sh

  # A release or dispatch is deliberate, so an unconfigured (or partially configured) production-build environment
  # FAILS the run here, naming what is missing (ECC L2; dev only warns and skips). Only presence flags reach the step,
  # never a value (deploy-skip-when-unconfigured). FLY_API_TOKEN lives in `production` and is checked in the release job.
  config:
    name: config
    needs: detect
    if: needs.detect.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency: # per run: nothing shared with any other run, so no run can hold or replace it (no workflow-level group)
      group: deploy-production-config-${{ github.run_id }}
      cancel-in-progress: false
    environment:
      name: production-build # presence checks only
    permissions:
      contents: read # the check script
    outputs:
      configured: ${{ steps.config.outputs.configured }}
    steps:
      - name: Checkout (deploy scripts only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.detect.outputs.sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts/deploy
      - name: Check the production build configuration (names only)
        id: config
        env:
          BUILD_ENVIRONMENT: production-build
          WORKFLOW: deploy.yml
          MISSING_IS_ERROR: "true" # a release or dispatch is deliberate: missing config fails the run (ECC L2)
          HAS_VITE_CHAIN_ID: ${{ vars.VITE_CHAIN_ID != '' }}
          HAS_VITE_RPC_URL: ${{ vars.VITE_RPC_URL != '' }}
          HAS_VITE_BUNDLER_URL: ${{ secrets.VITE_BUNDLER_URL != '' }}
          HAS_VITE_SPONSORSHIP_POLICY_ID: ${{ vars.VITE_SPONSORSHIP_POLICY_ID != '' }}
          HAS_VITE_TURBO_UPLOAD_URL: ${{ vars.VITE_TURBO_UPLOAD_URL != '' }}
          HAS_VITE_ARWEAVE_GATEWAY_URL: ${{ vars.VITE_ARWEAVE_GATEWAY_URL != '' }}
          HAS_VITE_RP_ID: ${{ vars.VITE_RP_ID != '' }}
          HAS_VITE_RP_NAME: ${{ vars.VITE_RP_NAME != '' }}
        run: .github/scripts/deploy/check-config.sh

  # The FULL CI on the tagged commit (the run's own commit: it runs at the tag ref).
  test:
    name: test
    needs: [detect, config]
    if: needs.detect.outputs.deploy == 'true' && needs.config.outputs.configured == 'true'
    uses: ./.github/workflows/ci.yml # not `$/...`: actionlint 1.7.12 rejects it (rhysd/actionlint#711); zizmor ignore in .github/zizmor.yml
    with:
      full: true
    permissions:
      contents: read # the called CI checks out code
      pull-requests: read # the most any called job declares (its PR path filter, skipped here)

  # Runs all build code (pnpm, vite, plugins) WITHOUT the Fly token: DEPLOY_TARGET=production deploy.sh --build-only
  # performs every guard (clean tree, no exported VITE_*, RP ID == cryoshield.app, two identical production builds,
  # bundle checks) and writes deploy/.build (site, Caddyfile, release manifest, site/release.json).
  build:
    name: build
    needs: [detect, config, test]
    if: needs.detect.outputs.deploy == 'true' && needs.config.outputs.configured == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency: # per run: nothing shared with any other run, so no run can hold or replace it (no workflow-level group)
      group: deploy-production-build-${{ github.run_id }}
      cancel-in-progress: false
    environment:
      name: production-build # build config only; never the Fly token
    permissions:
      contents: read # checkout only
    steps:
      - name: Checkout the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.detect.outputs.sha }}
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Write apps/web/.env from the production-build environment
        id: web-env
        env:
          VITE_CHAIN_ID: ${{ vars.VITE_CHAIN_ID }}
          VITE_RPC_URL: ${{ vars.VITE_RPC_URL }}
          VITE_BUNDLER_URL: ${{ secrets.VITE_BUNDLER_URL }}
          VITE_SPONSORSHIP_POLICY_ID: ${{ vars.VITE_SPONSORSHIP_POLICY_ID }}
          VITE_TURBO_UPLOAD_URL: ${{ vars.VITE_TURBO_UPLOAD_URL }}
          VITE_ARWEAVE_GATEWAY_URL: ${{ vars.VITE_ARWEAVE_GATEWAY_URL }}
          VITE_ARWEAVE_FAST_INDEX_URL: ${{ vars.VITE_ARWEAVE_FAST_INDEX_URL }}
          VITE_RP_ID: ${{ vars.VITE_RP_ID }}
          VITE_RP_NAME: ${{ vars.VITE_RP_NAME }}
          VITE_CF_BEACON_TOKEN: ${{ vars.VITE_CF_BEACON_TOKEN }}
          BUILD_ENVIRONMENT: production-build
        run: .github/scripts/deploy/write-env.sh
      - name: Guarded build (DEPLOY_TARGET=production deploy.sh --build-only)
        id: build
        env:
          DEPLOY_TARGET: production
        run: apps/web/deploy/deploy.sh --build-only
      - name: Check the manifest names the tested commit
        env:
          SHA: ${{ needs.detect.outputs.sha }}
        run: |
          [ "$(jq -r .commit apps/web/deploy/.build/release-manifest.json)" = "$SHA" ] \
            || { echo "::error::release manifest commit differs from the tested commit"; exit 1; }
      - name: Upload the deploy context (site, Caddyfile, release manifest)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deploy-context-${{ needs.detect.outputs.sha }}
          path: apps/web/deploy/.build
          include-hidden-files: true # site/.well-known/security.txt
          if-no-files-found: error
          retention-days: 7 # the bundle (and its public bundler key) only needs to outlive the deploy

  # The ONLY job in environment `production`: re-checks the tag right before deploying, deploys, smoke-tests and, on failure or cancellation
  # after `fly deploy` started, rolls back. It holds the Fly token and runs only flyctl, curl, jq, gh and coreutils on
  # the verified build artifact (enforced by workflow-policy.mjs).
  release:
    name: release
    needs: [detect, build]
    if: needs.detect.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: production
      url: https://cryoshield.app
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read # checkout, and the tag and main reachability checks via the API
    steps:
      - name: Checkout (fly.toml, Dockerfile, .dockerignore, deploy scripts, deployment records, donation config)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.detect.outputs.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/deploy
            apps/web/fly.toml
            apps/web/.dockerignore
            apps/web/deploy/Dockerfile
            contracts/deployments
            config/donation.json
          sparse-checkout-cone-mode: false
      - name: Download the deploy context built without the token
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deploy-context-${{ needs.detect.outputs.sha }}
          path: apps/web/deploy/.build
      - name: Verify the context against its release manifest
        env:
          SHA: ${{ needs.detect.outputs.sha }}
        run: |
          set -euo pipefail
          m=apps/web/deploy/.build/release-manifest.json
          [ "$(jq -r .commit "$m")" = "$SHA" ] || { echo "::error::manifest commit differs from the tested commit"; exit 1; }
          tree="sha256:$(cd apps/web/deploy/.build/site && find . -type f ! -path ./release.json | sed 's#^\./##' | LC_ALL=C sort \
            | while IFS= read -r f; do sha256sum "$f"; done | sha256sum | cut -d' ' -f1)"
          [ "$tree" = "$(jq -r .treeHash "$m")" ] || { echo "::error::site tree hash $tree differs from the manifest"; exit 1; }
          [ "$(jq -r .commit apps/web/deploy/.build/site/release.json)" = "$SHA" ] || { echo "::error::release.json names another commit"; exit 1; }
          caddy="sha256:$(sha256sum apps/web/deploy/.build/Caddyfile | cut -d' ' -f1)"
          [ "$caddy" = "$(jq -r .caddyfile "$m")" ] || { echo "::error::Caddyfile hash $caddy differs from the manifest"; exit 1; }
          # Integrity only: a compromised build could forge a consistent manifest. Residual risk, design.md (ECC #5).
      - name: Install flyctl (pinned, checksum-verified)
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/flyctl.tar.gz" \
            "https://github.com/superfly/flyctl/releases/download/v${FLYCTL_VERSION}/flyctl_${FLYCTL_VERSION}_Linux_x86_64.tar.gz"
          echo "${FLYCTL_SHA256}  ${RUNNER_TEMP}/flyctl.tar.gz" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/fly-bin"
          tar -xzf "${RUNNER_TEMP}/flyctl.tar.gz" -C "${RUNNER_TEMP}/fly-bin" flyctl
          ln -sf flyctl "${RUNNER_TEMP}/fly-bin/fly"
          echo "${RUNNER_TEMP}/fly-bin" >> "${GITHUB_PATH}"
      # Right before fly deploy (ECC L1). Not "is this main's HEAD" (main moves on after a tag): the tag must still point at the commit that was tested
      # and built, and that commit must still be reachable from main.
      - name: Refuse a release whose tag moved or left main
        id: tag-check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.detect.outputs.tag }}
          EXPECT_SHA: ${{ needs.detect.outputs.sha }}
        run: .github/scripts/deploy/release-ref.sh
      # Record the live image (rollback target), then deploy.
      - name: Deploy the built context (flyctl only)
        id: deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          APP: ${{ env.FLY_APP }}
          DEPLOY_ENVIRONMENT: production
        run: |
          set -euo pipefail
          .github/scripts/deploy/previous-image.sh
          echo "fly_started=true" >> "${GITHUB_OUTPUT}"
          cd apps/web
          fly deploy --config "$FLY_CONFIG" --remote-only --app "$FLY_APP"
      - name: Record the release in the job summary
        env:
          TAG: ${{ needs.detect.outputs.tag }}
        run: |
          set -euo pipefail
          m=apps/web/deploy/.build/release-manifest.json
          {
            echo "### Deployed ${SITE_URL} (release ${TAG})"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| commit | \`$(jq -r .commit "$m")\` |"
            echo "| treeHash | \`$(jq -r .treeHash "$m")\` |"
            echo "| chain | \`$(jq -r .config.chainId "$m")\` |"
            echo "| rpId | \`$(jq -r .config.rpId "$m")\` |"
            echo "| registry | \`$(jq -r .config.registry.address "$m")\` |"
            echo ""
            echo "Release manifest: artifact \`deploy-context-$(jq -r .commit "$m")\`."
          } >> "${GITHUB_STEP_SUMMARY}"
      # Chain and registry come from the verified manifest and the deployment record at the same commit, so this job
      # needs no variables from production-build, and nothing here names a chain.
      - name: Smoke test the live site
        id: smoke
        env:
          EXPECT_SHA: ${{ needs.detect.outputs.sha }}
          BASE_URL: ${{ env.SITE_URL }}
          EXPECT_NOINDEX: "false"
        run: |
          set -euo pipefail
          m=apps/web/deploy/.build/release-manifest.json
          chain="$(jq -r .config.chainId "$m")"
          [[ "$chain" =~ ^[0-9]+$ ]] || { echo "::error::manifest chainId is not a chain id"; exit 1; }
          REGISTRY_ADDRESS="$(jq -r .address "contracts/deployments/${chain}.json")"
          [ "$(jq -r .config.registry.address "$m" | tr 'A-F' 'a-f')" = "$(tr 'A-F' 'a-f' <<<"$REGISTRY_ADDRESS")" ] \
            || { echo "::error::manifest registry differs from contracts/deployments/${chain}.json"; exit 1; }
          export REGISTRY_ADDRESS
          DONATION_ADDRESS="$(jq -r .address config/donation.json)"
          [[ "$DONATION_ADDRESS" =~ ^0x[0-9a-fA-F]{40}$ ]] || { echo "::error::config/donation.json .address is not 0x + 40 hex (got '${DONATION_ADDRESS}'); is the file in the sparse checkout?"; exit 1; }
          export DONATION_ADDRESS
          .github/scripts/deploy/smoke.sh
      # Same job: also on cancellation after `fly deploy` started. Uses the NEW commit's fly.toml with the previous
      # image (docs/deploy.md -> Rollback, review L1).
      - name: Roll back to the previous release
        id: rollback
        if: (failure() || cancelled()) && steps.deploy.outputs.fly_started == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          PREVIOUS_IMAGE: ${{ steps.deploy.outputs.previous_image }}
          APP: ${{ env.FLY_APP }}
          CONFIG: apps/web/${{ env.FLY_CONFIG }}
          BASE_URL: ${{ env.SITE_URL }}
        run: .github/scripts/deploy/rollback.sh
      - name: Fail loudly
        if: failure() || cancelled()
        env:
          SHA: ${{ needs.detect.outputs.sha }}
          TAG: ${{ needs.detect.outputs.tag }}
          DEPLOY: ${{ steps.deploy.outcome }}
          SMOKE: ${{ steps.smoke.outcome }}
          ROLLBACK: ${{ steps.rollback.outcome }}
        run: |
          {
            echo "### Release ${TAG} (\`$SHA\`) FAILED"
            echo ""
            echo "deploy: **${DEPLOY:-not run}**, smoke test: **${SMOKE:-not run}**, automatic rollback: **${ROLLBACK:-not attempted}**."
            echo "Fix forward with a new release, or redeploy a good one: gh workflow run deploy.yml --ref <vX.Y.Z> (docs/deploy.md -> Rollback)."
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "::error title=deploy::Release ${TAG} ($SHA) failed (deploy: ${DEPLOY:-not run}, smoke: ${SMOKE:-not run}, rollback: ${ROLLBACK:-not attempted})."
          exit 1
