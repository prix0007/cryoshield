# Continuous deployment of https://cryoshield.app from main (OpenSpec changes add-continuous-deploy,
# gate-production-deploys).
#
#   detect -> config (env production-build: is the build config there? if not, warn and skip the rest
#   successfully, deploy-skip-when-unconfigured) -> test (FULL ci.yml on this exact commit) -> build (env production-build: deploy.sh --build-only, no Fly
#   token) -> supersede (cancel OLDER runs still waiting for approval) -> release (env production: OWNER APPROVAL,
#   then deploy + smoke test + automatic rollback, all in one job so one click covers the release)
#
# Triggers: push to main (human merges); every 15 minutes (merges by GitHub auto-merge do not start push
# workflows); workflow_dispatch (with `force` to redeploy). Never on pull requests (enforced by
# .github/scripts/workflow-policy.mjs).
#
# Concurrency: per commit at the workflow level (the schedule never stacks runs for the same commit while one waits
# for approval); `deploy-production` on the release job only, never cancelled (one release at a time, never cut
# mid-deploy). Superseding of stale waiting releases is done by the `supersede` job (design decision 3).
#
# Credentials: FLY_API_TOKEN (Fly deploy token scoped to cryoshield-web) lives only in the GitHub Environment
# `production` (required reviewer: the owner, admins cannot bypass; main only) and is used only by the `deploy` and
# `rollback` steps of the release job, which runs no node/pnpm or third-party build code. Build config (VITE_* and
# VITE_BUNDLER_URL) lives in `production-build` (main only, no reviewers). Runbook: docs/deploy.md.

name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *" # catches auto-merges (public repo: Actions minutes are free)
  workflow_dispatch:
    inputs:
      force:
        description: Redeploy even if the live site already serves main's HEAD (or a previous deploy of it failed)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.sha }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  SITE_URL: https://cryoshield.app
  # flyctl from the GitHub release, verified against flyctl_0.4.111_checksums.txt (2026-10-04).
  FLYCTL_VERSION: "0.4.111"
  FLYCTL_SHA256: 1878d7fb1f8a418039042cf0749e4b7216c6c7018b66ae10611a64c2b6d9aa9e # flyctl_0.4.111_Linux_x86_64.tar.gz

jobs:
  detect:
    name: detect
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # read main's HEAD and the detect script
      actions: read # earlier Deploy runs of this commit (do not retry a failed run every 15 minutes)
    outputs:
      deploy: ${{ steps.detect.outputs.deploy }}
      live: ${{ steps.detect.outputs.live }}
      sha: ${{ github.sha }}
    steps:
      - name: Checkout (deploy scripts only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts/deploy
      - name: Compare the live commit with main
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
          FORCE: ${{ inputs.force == true }}
          BASE_URL: ${{ env.SITE_URL }}
        run: |
          set -euo pipefail
          MAIN_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          # ANY failed earlier Deploy run of this commit (test, build, deploy or smoke) stops automatic retries; a
          # newer commit or workflow_dispatch force=true deploys again (ECC review #1).
          failed="$(gh run list -R "${GITHUB_REPOSITORY}" --workflow deploy.yml --commit "${TARGET_SHA}" --status failure \
                      --limit 1 --json databaseId --jq 'length')"
          PREVIOUSLY_FAILED=false
          if [ "$failed" != "0" ]; then PREVIOUSLY_FAILED=true; fi
          export MAIN_SHA PREVIOUSLY_FAILED
          .github/scripts/deploy/detect.sh

  # An unconfigured (or partially configured) production-build environment must not turn main red: warn with the
  # missing NAMES and skip everything after this job; the run succeeds. Only presence flags reach the step, never a
  # value (deploy-skip-when-unconfigured). FLY_API_TOKEN lives behind the approval in `production` and is checked
  # there, after a human approved.
  config:
    name: config
    needs: detect
    if: needs.detect.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: production-build # presence checks only; no approval needed
    permissions:
      contents: read # the check script
    outputs:
      configured: ${{ steps.config.outputs.configured }}
    steps:
      - name: Checkout (deploy scripts only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.detect.outputs.sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts/deploy
      - name: Check the production build configuration (names only)
        id: config
        env:
          LIVE: ${{ needs.detect.outputs.live }}
          HAS_VITE_CHAIN_ID: ${{ vars.VITE_CHAIN_ID != '' }}
          HAS_VITE_RPC_URL: ${{ vars.VITE_RPC_URL != '' }}
          HAS_VITE_BUNDLER_URL: ${{ secrets.VITE_BUNDLER_URL != '' }}
          HAS_VITE_SPONSORSHIP_POLICY_ID: ${{ vars.VITE_SPONSORSHIP_POLICY_ID != '' }}
          HAS_VITE_TURBO_UPLOAD_URL: ${{ vars.VITE_TURBO_UPLOAD_URL != '' }}
          HAS_VITE_ARWEAVE_GATEWAY_URL: ${{ vars.VITE_ARWEAVE_GATEWAY_URL != '' }}
          HAS_VITE_RP_ID: ${{ vars.VITE_RP_ID != '' }}
          HAS_VITE_RP_NAME: ${{ vars.VITE_RP_NAME != '' }}
        run: .github/scripts/deploy/check-config.sh

  test:
    name: test
    needs: [detect, config]
    if: needs.detect.outputs.deploy == 'true' && needs.config.outputs.configured == 'true'
    uses: ./.github/workflows/ci.yml # not `$/...`: actionlint 1.7.12 rejects it (rhysd/actionlint#711); zizmor ignore in .github/zizmor.yml
    with:
      full: true
    permissions:
      contents: read # the called CI checks out code
      pull-requests: read # the most any called job declares (its PR path filter, skipped here)

  # Runs all build code (pnpm, vite, plugins) WITHOUT the Fly token: deploy.sh --build-only performs every guard
  # (clean tree, no exported VITE_*, RP ID == host, two identical production builds, bundle checks) and writes
  # deploy/.build (site, Caddyfile, release manifest, site/release.json).
  build:
    name: build
    needs: [detect, config, test]
    if: needs.detect.outputs.deploy == 'true' && needs.config.outputs.configured == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production-build # build config only; never the Fly token; no approval needed
    permissions:
      contents: read # checkout only
    steps:
      - name: Checkout the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.detect.outputs.sha }}
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Write apps/web/.env from the production-build environment
        id: web-env
        env:
          VITE_CHAIN_ID: ${{ vars.VITE_CHAIN_ID }}
          VITE_RPC_URL: ${{ vars.VITE_RPC_URL }}
          VITE_BUNDLER_URL: ${{ secrets.VITE_BUNDLER_URL }}
          VITE_SPONSORSHIP_POLICY_ID: ${{ vars.VITE_SPONSORSHIP_POLICY_ID }}
          VITE_TURBO_UPLOAD_URL: ${{ vars.VITE_TURBO_UPLOAD_URL }}
          VITE_ARWEAVE_GATEWAY_URL: ${{ vars.VITE_ARWEAVE_GATEWAY_URL }}
          VITE_ARWEAVE_FAST_INDEX_URL: ${{ vars.VITE_ARWEAVE_FAST_INDEX_URL }}
          VITE_RP_ID: ${{ vars.VITE_RP_ID }}
          VITE_RP_NAME: ${{ vars.VITE_RP_NAME }}
          VITE_CF_BEACON_TOKEN: ${{ vars.VITE_CF_BEACON_TOKEN }}
        run: .github/scripts/deploy/write-env.sh
      - name: Guarded build (deploy.sh --build-only)
        id: build
        run: apps/web/deploy/deploy.sh --build-only
      - name: Check the manifest names the tested commit
        env:
          SHA: ${{ needs.detect.outputs.sha }}
        run: |
          [ "$(jq -r .commit apps/web/deploy/.build/release-manifest.json)" = "$SHA" ] \
            || { echo "::error::release manifest commit differs from the tested commit"; exit 1; }
      - name: Upload the deploy context (site, Caddyfile, release manifest)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deploy-context-${{ needs.detect.outputs.sha }}
          path: apps/web/deploy/.build
          include-hidden-files: true # site/.well-known/security.txt
          if-no-files-found: error
          retention-days: 7 # the bundle (and its public bundler key) only needs to outlive the deploy

  # Cancels OLDER deploy.yml runs that are still WAITING for the production approval, for another commit, now that
  # this newer commit passed CI and built (gate-production-deploys D3). Never touches a run that is deploying.
  supersede:
    name: supersede
    needs: [detect, build]
    if: needs.detect.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # the supersede script
      actions: write # cancel older runs still waiting for the production approval
    steps:
      - name: Checkout (deploy scripts only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.detect.outputs.sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts/deploy
      # Shown on the run page before the approval: the diff against the live commit, with every file that can
      # change what runs with the Fly token flagged (security review H1).
      - name: Summarise what this release changes (read before approving)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TARGET_SHA: ${{ needs.detect.outputs.sha }}
          BASE_URL: ${{ env.SITE_URL }}
        run: .github/scripts/deploy/release-diff.sh
      - name: Cancel older releases still waiting for approval
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          TARGET_SHA: ${{ needs.detect.outputs.sha }}
        run: .github/scripts/deploy/supersede.sh

  # The ONLY job in environment `production`: it waits for the owner's approval, then deploys, smoke-tests and, on
  # failure or cancellation after `fly deploy` started, rolls back, all under that one approval. It holds the Fly
  # token and runs only flyctl, curl, jq and coreutils on the verified build artifact (enforced by workflow-policy.mjs).
  release:
    name: release
    needs: [detect, build, supersede]
    if: needs.detect.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: production
      url: https://cryoshield.app
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read # checkout, and main's HEAD for the head check
    steps:
      # Runs after the approval: an older commit approved late (its run was slower than a newer one, so supersede
      # never saw it waiting) must not roll the site back (security review M1).
      - name: Refuse a release that is no longer main's HEAD
        id: head-check
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.detect.outputs.sha }}
        run: |
          set -euo pipefail
          head="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          if [ "$head" != "$SHA" ]; then
            echo "::error title=Superseded::main moved on to ${head}; this release (${SHA}) is stale. Approve the newer Deploy run instead."
            exit 1
          fi
      - name: Checkout (fly.toml, Dockerfile, .dockerignore, deploy scripts, deployment records, donation config)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.detect.outputs.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/deploy
            apps/web/fly.toml
            apps/web/.dockerignore
            apps/web/deploy/Dockerfile
            contracts/deployments
            config/donation.json
          sparse-checkout-cone-mode: false
      - name: Download the deploy context built without the token
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deploy-context-${{ needs.detect.outputs.sha }}
          path: apps/web/deploy/.build
      - name: Verify the context against its release manifest
        env:
          SHA: ${{ needs.detect.outputs.sha }}
        run: |
          set -euo pipefail
          m=apps/web/deploy/.build/release-manifest.json
          [ "$(jq -r .commit "$m")" = "$SHA" ] || { echo "::error::manifest commit differs from the tested commit"; exit 1; }
          tree="sha256:$(cd apps/web/deploy/.build/site && find . -type f ! -path ./release.json | sed 's#^\./##' | LC_ALL=C sort \
            | while IFS= read -r f; do sha256sum "$f"; done | sha256sum | cut -d' ' -f1)"
          [ "$tree" = "$(jq -r .treeHash "$m")" ] || { echo "::error::site tree hash $tree differs from the manifest"; exit 1; }
          [ "$(jq -r .commit apps/web/deploy/.build/site/release.json)" = "$SHA" ] || { echo "::error::release.json names another commit"; exit 1; }
          caddy="sha256:$(sha256sum apps/web/deploy/.build/Caddyfile | cut -d' ' -f1)"
          [ "$caddy" = "$(jq -r .caddyfile "$m")" ] || { echo "::error::Caddyfile hash $caddy differs from the manifest"; exit 1; }
          # Integrity only: a compromised build could forge a consistent manifest. Residual risk, design.md (ECC #5).
      - name: Install flyctl (pinned, checksum-verified)
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/flyctl.tar.gz" \
            "https://github.com/superfly/flyctl/releases/download/v${FLYCTL_VERSION}/flyctl_${FLYCTL_VERSION}_Linux_x86_64.tar.gz"
          echo "${FLYCTL_SHA256}  ${RUNNER_TEMP}/flyctl.tar.gz" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/fly-bin"
          tar -xzf "${RUNNER_TEMP}/flyctl.tar.gz" -C "${RUNNER_TEMP}/fly-bin" flyctl
          ln -sf flyctl "${RUNNER_TEMP}/fly-bin/fly"
          echo "${RUNNER_TEMP}/fly-bin" >> "${GITHUB_PATH}"
      # Record the live image (rollback target), then deploy.
      - name: Deploy the built context (flyctl only)
        id: deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          .github/scripts/deploy/previous-image.sh
          echo "fly_started=true" >> "${GITHUB_OUTPUT}"
          cd apps/web
          fly deploy --config fly.toml --remote-only --app cryoshield-web
      - name: Record the release in the job summary
        run: |
          set -euo pipefail
          m=apps/web/deploy/.build/release-manifest.json
          {
            echo "### Deployed https://cryoshield.app"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| commit | \`$(jq -r .commit "$m")\` |"
            echo "| treeHash | \`$(jq -r .treeHash "$m")\` |"
            echo "| chain | \`$(jq -r .config.chainId "$m")\` |"
            echo "| registry | \`$(jq -r .config.registry.address "$m")\` |"
            echo ""
            echo "Release manifest: artifact \`deploy-context-$(jq -r .commit "$m")\`."
          } >> "${GITHUB_STEP_SUMMARY}"
      # Chain and registry come from the verified manifest and the deployment record at the same commit, so this job
      # needs no variables from production-build.
      - name: Smoke test the live site
        id: smoke
        env:
          EXPECT_SHA: ${{ needs.detect.outputs.sha }}
          BASE_URL: ${{ env.SITE_URL }}
        run: |
          set -euo pipefail
          m=apps/web/deploy/.build/release-manifest.json
          chain="$(jq -r .config.chainId "$m")"
          [[ "$chain" =~ ^[0-9]+$ ]] || { echo "::error::manifest chainId is not a chain id"; exit 1; }
          REGISTRY_ADDRESS="$(jq -r .address "contracts/deployments/${chain}.json")"
          [ "$(jq -r .config.registry.address "$m" | tr 'A-F' 'a-f')" = "$(tr 'A-F' 'a-f' <<<"$REGISTRY_ADDRESS")" ] \
            || { echo "::error::manifest registry differs from contracts/deployments/${chain}.json"; exit 1; }
          export REGISTRY_ADDRESS
          DONATION_ADDRESS="$(jq -r .address config/donation.json)"
          [[ "$DONATION_ADDRESS" =~ ^0x[0-9a-fA-F]{40}$ ]] || { echo "::error::config/donation.json .address is not 0x + 40 hex (got '${DONATION_ADDRESS}'); is the file in the sparse checkout?"; exit 1; }
          export DONATION_ADDRESS
          .github/scripts/deploy/smoke.sh
      # Same approved job: no second approval. Also on cancellation after `fly deploy` started (e.g. a supersede race).
      # Uses the NEW commit's fly.toml with the previous image (docs/deploy.md -> Rollback, review L1).
      - name: Roll back to the previous release
        id: rollback
        if: (failure() || cancelled()) && steps.deploy.outputs.fly_started == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          PREVIOUS_IMAGE: ${{ steps.deploy.outputs.previous_image }}
          BASE_URL: ${{ env.SITE_URL }}
        run: .github/scripts/deploy/rollback.sh
      - name: Fail loudly
        if: failure() || cancelled()
        env:
          SHA: ${{ needs.detect.outputs.sha }}
          DEPLOY: ${{ steps.deploy.outcome }}
          SMOKE: ${{ steps.smoke.outcome }}
          ROLLBACK: ${{ steps.rollback.outcome }}
        run: |
          {
            echo "### Release of \`$SHA\` FAILED"
            echo ""
            echo "deploy: **${DEPLOY:-not run}**, smoke test: **${SMOKE:-not run}**, automatic rollback: **${ROLLBACK:-not attempted}**."
            echo "This commit will not be retried automatically; fix forward, or see docs/deploy.md -> Rollback."
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "::error title=deploy::The release of $SHA failed (deploy: ${DEPLOY:-not run}, smoke: ${SMOKE:-not run}, rollback: ${ROLLBACK:-not attempted})."
          exit 1
