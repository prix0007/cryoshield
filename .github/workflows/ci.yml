# CryoShield CI (OpenSpec change: add-ci).
#
# Hardening (design.md decision 7):
# - push (main) and pull_request only; never the privileged PR "target" trigger.
# - read-only GITHUB_TOKEN; no secrets referenced anywhere.
# - every third-party action pinned to a full commit SHA (checked by zizmor in `workflow-lint`).
# - checkout never persists credentials; installs use committed lockfiles only.
# - no dependency caches (avoids cache poisoning across PRs; revisit if CI time matters).
#
# Branch protection should require only the aggregate `ci-ok` check.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read # least privilege; no job needs to write

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FOUNDRY_VERSION: v1.1.0
  NODE_VERSION: "22"
  UV_VERSION: "0.12.21"
  SLITHER_VERSION: "0.11.6"
  ZIZMOR_VERSION: "1.30.1"
  OPENSPEC_VERSION: "1.14.0"
  FORCE_COLOR: "1"

jobs:
  # Path filter. On pull requests the filter reads the changed-file list from the API (no checkout).
  # On push to main every area job runs, so main is always fully verified.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # default for the workflow
      pull-requests: read # paths-filter lists the PR's changed files via the API
    outputs:
      contracts: ${{ steps.filter.outputs.contracts }}
      vault-crypto: ${{ steps.filter.outputs.vault-crypto }}
      recover: ${{ steps.filter.outputs.recover }}
      web: ${{ steps.filter.outputs.web }}
      openspec: ${{ steps.filter.outputs.openspec }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            ci: &ci
              - .github/workflows/ci.yml
            pnpm: &pnpm
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
            contracts:
              - *ci
              - contracts/**
              - .github/slither-triage.json
            vault-crypto:
              - *ci
              - *pnpm
              - packages/vault-crypto/**
            recover:
              - *ci
              - tools/recover/**
              - packages/vault-crypto/test-vectors/**
              - contracts/src/**
              - contracts/foundry.toml
            web:
              - *ci
              - *pnpm
              - apps/web/**
              - packages/vault-crypto/**
              - contracts/src/**
              - contracts/foundry.toml
              - contracts/deployments/**
            openspec:
              - *ci
              - openspec/**
              - .github/openspec-cli/**
            workflows:
              - .github/**

  workflow-lint:
    needs: changes
    if: always() && (github.event_name == 'push' || needs.changes.outputs.workflows == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: actionlint
        run: >-
          docker run --rm -v "$PWD:/repo" --workdir /repo
          rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -color
      - name: zizmor (SHA pinning, permissions, injection)
        run: uvx "zizmor==${ZIZMOR_VERSION}" --offline --config .github/zizmor.yml .github

  contracts:
    needs: changes
    if: always() && (github.event_name == 'push' || needs.changes.outputs.contracts == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
          cache: false
      - name: forge build
        run: forge build
      - name: forge test
        run: forge test
      - name: Gas snapshot check
        run: forge snapshot --mc GasTest --check
      # forge test rewrites per-call snapshots (vm.snapshotGasLastCall); fail if they drifted from the committed file.
      - name: Per-call gas snapshot check
        run: git diff --exit-code -- snapshots/
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      # Triaged false positives live in .github/slither-triage.json (matched by finding id); any other finding fails.
      - name: Slither
        run: >-
          uvx --from "slither-analyzer==${SLITHER_VERSION}" slither .
          --filter-paths "lib/|test/|script/"
          --triage-database ../.github/slither-triage.json

  vault-crypto:
    needs: changes
    if: always() && (github.event_name == 'push' || needs.changes.outputs.vault-crypto == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Unit, vector and property tests (Node)
        run: pnpm --filter @cryoshield/vault-crypto test
      - name: Install Playwright Chromium
        run: pnpm --filter @cryoshield/vault-crypto exec playwright install --with-deps chromium
      - name: Same suite in headless Chromium
        run: pnpm --filter @cryoshield/vault-crypto test:browser

  recover:
    needs: changes
    if: always() && (github.event_name == 'push' || needs.changes.outputs.recover == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: tools/recover
    env:
      UV_PYTHON: ${{ matrix.python }}
      EXPECTED_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # anvil + forge, so tests/test_anvil_e2e.py runs instead of auto-skipping.
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
          cache: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - run: uv sync --locked
      - name: Assert interpreter version
        run: uv run --locked python -c "import os, sys; v = '%d.%d' % sys.version_info[:2]; assert v == os.environ['EXPECTED_PYTHON'], v"
      - name: pytest (incl. vault-crypto cross-implementation vectors)
        run: uv run --locked pytest -q
      - name: ruff
        run: uv run --locked ruff check src tests
      - name: mypy (strict, targets from pyproject)
        run: uv run --locked mypy

  web:
    needs: changes
    if: always() && (github.event_name == 'push' || needs.changes.outputs.web == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
          cache: false
      - run: pnpm install --frozen-lockfile
      - name: Build contracts (the local chain stack deploys contracts/out)
        run: forge build
        working-directory: contracts
      - run: pnpm --filter @cryoshield/web typecheck
      - run: pnpm --filter @cryoshield/web lint
      - run: pnpm --filter @cryoshield/web test
      - name: Integration tests (anvil stack)
        run: pnpm --filter @cryoshield/web test:int
      - name: Reproducible build and bundle checks
        run: pnpm --filter @cryoshield/web verify-build

  web-e2e:
    needs: changes
    if: always() && (github.event_name == 'push' || needs.changes.outputs.web == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
          cache: false
      - run: pnpm install --frozen-lockfile
      - name: Build contracts (the local chain stack deploys contracts/out)
        run: forge build
        working-directory: contracts
      - name: Install Playwright Chromium
        run: pnpm --filter @cryoshield/web exec playwright install --with-deps chromium
      - name: Playwright E2E (Chromium, anvil stack, virtual authenticators)
        run: pnpm --filter @cryoshield/web test:e2e

  openspec:
    needs: changes
    if: always() && (github.event_name == 'push' || needs.changes.outputs.openspec == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      # OpenSpec CLI 1.14.0 from a committed npm lockfile (integrity-checked); no install scripts run.
      - name: Install OpenSpec CLI (locked)
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix .github/openspec-cli
      - name: Assert OpenSpec CLI version
        run: test "$(.github/openspec-cli/node_modules/.bin/openspec --version)" = "$OPENSPEC_VERSION"
      - run: .github/openspec-cli/node_modules/.bin/openspec validate --all --strict --no-interactive

  # The only check branch protection needs. Skipped area jobs count as success; failed or cancelled ones do not.
  ci-ok:
    needs: [changes, workflow-lint, contracts, vault-crypto, recover, web, web-e2e, openspec]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: All required jobs succeeded or were skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
