# CryoShield CI (OpenSpec changes: add-ci, adopt-pr-workflow).
#
# Hardening (add-ci design decision 7, adopt-pr-workflow decision 9), enforced by
# .github/scripts/workflow-policy.mjs and zizmor (pedantic) in `workflow-lint`:
# - push (main) and pull_request only; never the privileged PR "target" trigger.
# - read-only GITHUB_TOKEN at the top; every job declares its own minimal permissions and a timeout.
# - no secrets referenced anywhere; PR inputs (title, body, labels) reach scripts only through env:.
# - every action pinned to a full commit SHA; downloaded tools pinned by version and SHA-256.
# - checkout never persists credentials; installs use committed lockfiles only.
# - no dependency caches (avoids cache poisoning across PRs; revisit if CI time matters).
#
# The `main` ruleset (.github/rulesets/main.json) requires only the aggregate `ci-ok` check.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    # edited/labeled/unlabeled re-run the title and OpenSpec gates. Every job runs on every event, so a
    # later run can never report a partially skipped ci-ok for the same commit.
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  # Reused by the deploy workflows to run the FULL CI on the exact commit they deploy (add-continuous-deploy D4), so PR
  # CI and deploy CI can never drift. `full: true` forces every area job on, regardless of path filters. Every area job
  # checks out the caller's own commit: deploy.yml runs at the release tag, so that is the tagged commit.
  workflow_call:
    inputs:
      full:
        description: Run every area job regardless of changed paths
        type: boolean
        default: false

permissions:
  contents: read # least privilege; no job needs to write

concurrency:
  # github.workflow is the CALLER's name in a called run, so deploy CI never queues behind or cancels push CI.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Cancel superseded PR runs; every push to main is verified to completion.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FOUNDRY_VERSION: v1.1.0
  NODE_VERSION: "22"
  UV_VERSION: "0.12.21"
  SLITHER_VERSION: "0.11.6"
  ZIZMOR_VERSION: "1.30.1"
  OPENSPEC_VERSION: "1.14.0"
  # PR scanners (adopt-pr-workflow decisions 7-8): release assets verified against these SHA-256 sums.
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb # gitleaks_8.30.1_linux_x64.tar.gz
  OSV_SCANNER_VERSION: "2.6.0"
  OSV_SCANNER_SHA256: ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108 # osv-scanner_linux_amd64
  FORCE_COLOR: "1"

jobs:
  # Path filter. On pull requests the filter reads the changed-file list from the API (no checkout).
  # On push to main every area job runs, so main is always fully verified.
  changes:
    name: changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # default for the workflow
      pull-requests: read # paths-filter lists the PR's changed files via the API
    outputs:
      contracts: ${{ steps.filter.outputs.contracts }}
      vault-crypto: ${{ steps.filter.outputs.vault-crypto }}
      recover: ${{ steps.filter.outputs.recover }}
      web: ${{ steps.filter.outputs.web }}
      openspec: ${{ steps.filter.outputs.openspec }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            ci: &ci
              - .github/workflows/ci.yml
            pnpm: &pnpm
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
            contracts:
              - *ci
              - contracts/**
              - .github/slither-triage.json
            vault-crypto:
              - *ci
              - *pnpm
              - packages/vault-crypto/**
            recover:
              - *ci
              - tools/recover/**
              - packages/vault-crypto/test-vectors/**
              - contracts/src/**
              - contracts/foundry.toml
            web:
              - *ci
              - *pnpm
              - apps/web/**
              - docs/supported-devices.md # rendered into /devices (add-supported-devices-page)
              - config/donation.json # the donation address, built into /support (add-donation)
              - README.md # must publish the same donation address (add-donation)
              - packages/vault-crypto/**
              - contracts/src/**
              - contracts/foundry.toml
              - contracts/deployments/**
            openspec:
              - *ci
              - openspec/**
              - .github/openspec-cli/**
              # license consistency check (spec: project-licensing)
              - LICENSE
              - scripts/check-licenses.sh
              - '**/package.json'
              - '**/pyproject.toml'
              - 'contracts/**/*.sol'
            workflows:
              - .github/**
              - .gitleaks.toml

  # PR-only hardening gates (adopt-pr-workflow). Runs on every PR event; skipped (= success) on push.
  pr-checks:
    name: pr-checks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # checkout only; no API calls, no writes
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout (full history, for the PR commit range)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Install gate-script dependencies (locked)
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix .github/scripts
      - name: PR title is a Conventional Commit
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node .github/scripts/pr-title.mjs
      - name: OpenSpec gate (code changes need an OpenSpec change or a justified no-spec label)
        env:
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels) }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          git -c core.quotePath=false diff -z --name-only --no-renames "${BASE_SHA}...${HEAD_SHA}" > "${RUNNER_TEMP}/changed-files"
          node .github/scripts/openspec-gate.mjs "${RUNNER_TEMP}/changed-files"
      - name: Legal pages change their effective date with their text (add-privacy-and-compliance 3.5)
        run: node apps/web/scripts/check-legal-dates.mjs --base "${BASE_SHA}"
      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/gitleaks.tar.gz" -C "${RUNNER_TEMP}" gitleaks
          "${RUNNER_TEMP}/gitleaks" version
      - name: gitleaks allowlist self-test (allowlist stays narrow)
        run: .github/scripts/gitleaks-selftest.sh "${RUNNER_TEMP}/gitleaks" .gitleaks.toml
      # -m: also diff merge commits against each parent, so content added in a conflict resolution is scanned.
      - name: gitleaks (every commit in the PR range)
        run: >-
          "${RUNNER_TEMP}/gitleaks" git --no-banner --redact --config .gitleaks.toml
          --log-opts="-m ${BASE_SHA}..${HEAD_SHA}" .
      - name: Install osv-scanner (pinned, checksum-verified)
        run: |
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  ${RUNNER_TEMP}/osv-scanner" | sha256sum -c -
          chmod +x "${RUNNER_TEMP}/osv-scanner"
      - name: osv-scanner (fail on HIGH/CRITICAL in any lockfile)
        run: |
          set +e
          "${RUNNER_TEMP}/osv-scanner" scan source --config .github/osv-scanner.toml \
            --format json --output-file "${RUNNER_TEMP}/osv.json" \
            -L pnpm-lock.yaml -L tools/recover/uv.lock \
            -L .github/openspec-cli/package-lock.json -L .github/scripts/package-lock.json
          code=$?
          set -e
          node .github/scripts/osv-gate.mjs --config .github/osv-scanner.toml \
            --report "${RUNNER_TEMP}/osv.json" --scanner-exit "${code}"

  workflow-lint:
    name: workflow-lint
    needs: changes
    if: always() && (inputs.full || github.event_name == 'push' || needs.changes.outputs.workflows == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # checkout only
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: actionlint
        run: >-
          docker run --rm -v "$PWD:/repo" --workdir /repo
          rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -color
      - name: Install gate-script dependencies (locked)
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix .github/scripts
      - name: Gate-script unit tests
        run: npm test --prefix .github/scripts
      - name: Workflow policy (no pull_request_target, explicit permissions and timeouts, no secrets, no lint suppression)
        run: node .github/scripts/workflow-policy.mjs .github
      - name: zizmor, pedantic persona (SHA pinning, permissions, injection, credential persistence)
        run: uvx "zizmor==${ZIZMOR_VERSION}" --offline --persona=pedantic --config .github/zizmor.yml .github

  contracts:
    name: contracts
    needs: changes
    if: always() && (inputs.full || github.event_name == 'push' || needs.changes.outputs.contracts == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read # checkout only
    defaults:
      run:
        working-directory: contracts
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
          cache: false
      - name: forge build
        run: forge build
      - name: forge test
        run: forge test
      - name: Gas snapshot check
        run: forge snapshot --mc GasTest --check
      # forge test rewrites per-call snapshots (vm.snapshotGasLastCall); fail if they drifted from the committed file.
      - name: Per-call gas snapshot check
        run: git diff --exit-code -- snapshots/
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      # Triaged false positives live in .github/slither-triage.json (matched by finding id); any other finding fails.
      - name: Slither
        run: >-
          uvx --from "slither-analyzer==${SLITHER_VERSION}" slither .
          --filter-paths "lib/|test/|script/"
          --triage-database ../.github/slither-triage.json

  vault-crypto:
    name: vault-crypto
    needs: changes
    if: always() && (inputs.full || github.event_name == 'push' || needs.changes.outputs.vault-crypto == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read # checkout only
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Unit, vector and property tests (Node)
        run: pnpm --filter @cryoshield/vault-crypto test
      - name: Install Playwright Chromium
        run: pnpm --filter @cryoshield/vault-crypto exec playwright install --with-deps chromium
      - name: Same suite in headless Chromium
        run: pnpm --filter @cryoshield/vault-crypto test:browser

  recover:
    name: recover
    needs: changes
    if: always() && (inputs.full || github.event_name == 'push' || needs.changes.outputs.recover == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read # checkout only
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: tools/recover
    env:
      UV_PYTHON: ${{ matrix.python }}
      EXPECTED_PYTHON: ${{ matrix.python }}
      CRYOSHIELD_REQUIRE_FOUNDRY: "1" # the anvil v2 tests fail instead of skipping if Foundry is missing
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # anvil + forge, so tests/test_anvil_e2e.py runs instead of auto-skipping.
      - name: Set up Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
          cache: false
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Install (locked)
        run: uv sync --locked
      - name: Assert interpreter version
        run: uv run --locked python -c "import os, sys; v = '%d.%d' % sys.version_info[:2]; assert v == os.environ['EXPECTED_PYTHON'], v"
      - name: pytest (incl. vault-crypto cross-implementation vectors)
        run: uv run --locked pytest -q
      - name: ruff
        run: uv run --locked ruff check src tests
      - name: mypy (strict, targets from pyproject)
        run: uv run --locked mypy

  web:
    name: web
    needs: changes
    if: always() && (inputs.full || github.event_name == 'push' || needs.changes.outputs.web == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read # checkout only
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Set up Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
          cache: false
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Build contracts (the local chain stack deploys contracts/out)
        run: forge build
        working-directory: contracts
      # VaultRegistry v1 is deployed at a CREATE2 address that commits to its exact bytecode; only the `v1` Foundry
      # profile reproduces it (contracts/foundry.toml). The local chain stack deploys v1 from contracts/out-v1.
      - name: Build VaultRegistry v1 (v1 profile, contracts/out-v1)
        run: forge build
        working-directory: contracts
        env:
          FOUNDRY_PROFILE: v1
      # @cryoshield/vault-crypto resolves types from dist/ (gitignored), so build it before typechecking the web app.
      - name: Build workspace dependency vault-crypto
        run: pnpm --filter @cryoshield/vault-crypto build
      - name: Typecheck
        run: pnpm --filter @cryoshield/web typecheck
      - name: Lint
        run: pnpm --filter @cryoshield/web lint
      - name: Unit tests
        run: pnpm --filter @cryoshield/web test
      - name: Integration tests (anvil stack)
        run: pnpm --filter @cryoshield/web test:int
      - name: Reproducible build and bundle checks
        run: pnpm --filter @cryoshield/web verify-build

  web-e2e:
    name: web-e2e
    needs: changes
    if: always() && (inputs.full || github.event_name == 'push' || needs.changes.outputs.web == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read # checkout only
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Set up Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
          cache: false
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Build contracts (the local chain stack deploys contracts/out)
        run: forge build
        working-directory: contracts
      # VaultRegistry v1 is deployed at a CREATE2 address that commits to its exact bytecode; only the `v1` Foundry
      # profile reproduces it (contracts/foundry.toml). The local chain stack deploys v1 from contracts/out-v1.
      - name: Build VaultRegistry v1 (v1 profile, contracts/out-v1)
        run: forge build
        working-directory: contracts
        env:
          FOUNDRY_PROFILE: v1
      - name: Install Playwright Chromium
        run: pnpm --filter @cryoshield/web exec playwright install --with-deps chromium
      - name: Playwright E2E (Chromium, anvil stack, virtual authenticators)
        run: pnpm --filter @cryoshield/web test:e2e

  openspec:
    name: openspec
    needs: changes
    if: always() && (inputs.full || github.event_name == 'push' || needs.changes.outputs.openspec == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # checkout only
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      # OpenSpec CLI 1.14.0 from a committed npm lockfile (integrity-checked); no install scripts run.
      - name: Install OpenSpec CLI (locked)
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix .github/openspec-cli
      - name: Assert OpenSpec CLI version
        run: test "$(.github/openspec-cli/node_modules/.bin/openspec --version)" = "$OPENSPEC_VERSION"
      - name: Validate all changes and specs (strict)
        run: .github/openspec-cli/node_modules/.bin/openspec validate --all --strict --no-interactive
      - name: License consistency (all first-party declarations are MIT)
        run: scripts/check-licenses.sh

  # The only check the main ruleset requires. Skipped jobs count as success; failed or cancelled ones do not.
  ci-ok:
    name: ci-ok
    needs: [changes, pr-checks, workflow-lint, contracts, vault-crypto, recover, web, web-e2e, openspec]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {} # no checkout, no API calls
    steps:
      - name: All required jobs succeeded or were skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
