# Continuous deployment of every main commit to the DEVELOPMENT site https://cryoshield-web-dev.fly.dev (Fly app
# cryoshield-web-dev, OP Sepolia). OpenSpec changes add-continuous-deploy, deploy-skip-when-unconfigured,
# split-dev-and-release-deploys. Production is deploy.yml (owner-published releases only).
#
#   detect -> config (env development-build: is the build config there? if not, warn and skip the rest successfully)
#   -> test (FULL ci.yml on this exact commit) -> build (env development-build: DEPLOY_TARGET=development
#   deploy.sh --build-only, no Fly token; RP ID cryoshield-web-dev.fly.dev, noindex Caddyfile) -> release (env development:
#   head re-check, deploy + smoke test + automatic rollback, all in one job, no approval)
#
# Triggers: push to main (human merges); every 15 minutes (merges by GitHub auto-merge start no push workflows);
# workflow_dispatch (with `force` to redeploy). Never on pull requests (enforced by .github/scripts/workflow-policy.mjs).
#
# Concurrency: per commit at the workflow level (deploy-dev-<sha>; the schedule never stacks runs for one commit);
# `deploy-development` on the release job only, never cancelled (one dev release at a time, never cut mid-deploy).
# GitHub keeps at most one PENDING release per group, so a newer commit's release replaces an older pending one, and
# the head re-check refuses a commit that is no longer main's HEAD. Separate from production's groups.
#
# Credentials: FLY_API_TOKEN here is a Fly deploy token scoped to cryoshield-web-dev only (it cannot touch
# production). It lives only in the GitHub Environment `development` (main only) and is used only by the `deploy` and
# `rollback` steps of the release job, which runs no node/pnpm or build code. Build config (VITE_* and
# VITE_BUNDLER_URL, a dev-only Pimlico key) lives in `development-build` (main only). Runbook: docs/deploy.md.

name: Deploy (development)

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *" # catches auto-merges (public repo: Actions minutes are free)
  workflow_dispatch:
    inputs:
      force:
        description: Redeploy even if the dev site already serves main's HEAD (or a previous deploy of it failed)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-dev-${{ github.sha }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  SITE_URL: https://cryoshield-web-dev.fly.dev
  FLY_APP: cryoshield-web-dev
  FLY_CONFIG: fly.dev.toml
  # flyctl from the GitHub release, verified against flyctl_0.4.111_checksums.txt (2026-10-04).
  FLYCTL_VERSION: "0.4.111"
  FLYCTL_SHA256: 1878d7fb1f8a418039042cf0749e4b7216c6c7018b66ae10611a64c2b6d9aa9e # flyctl_0.4.111_Linux_x86_64.tar.gz

jobs:
  detect:
    name: detect
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # read main's HEAD and the detect script
      actions: read # earlier dev deploy runs of this commit (do not retry a failed run every 15 minutes)
    outputs:
      deploy: ${{ steps.detect.outputs.deploy }}
      sha: ${{ github.sha }}
    steps:
      - name: Checkout (deploy scripts only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts/deploy
      - name: Compare the dev site's commit with main
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
          FORCE: ${{ inputs.force == true }}
          BASE_URL: ${{ env.SITE_URL }}
        run: |
          set -euo pipefail
          MAIN_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          # ANY failed earlier dev deploy run of this commit (test, build, deploy or smoke) stops automatic retries; a
          # newer commit or workflow_dispatch force=true deploys again (ECC review #1).
          failed="$(gh run list -R "${GITHUB_REPOSITORY}" --workflow deploy-dev.yml --commit "${TARGET_SHA}" --status failure \
                      --limit 1 --json databaseId --jq 'length')"
          PREVIOUSLY_FAILED=false
          if [ "$failed" != "0" ]; then PREVIOUSLY_FAILED=true; fi
          export MAIN_SHA PREVIOUSLY_FAILED
          .github/scripts/deploy/detect.sh

  # An unconfigured (or partially configured) development-build environment must not turn main red: warn with the
  # missing NAMES and skip everything after this job; the run succeeds. Only presence flags reach the step, never a
  # value (deploy-skip-when-unconfigured). FLY_API_TOKEN lives in `development` and is checked in the release job.
  config:
    name: config
    needs: detect
    if: needs.detect.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: development-build # presence checks only
    permissions:
      contents: read # the check script
    outputs:
      configured: ${{ steps.config.outputs.configured }}
    steps:
      - name: Checkout (deploy scripts only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.detect.outputs.sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts/deploy
      - name: Check the development build configuration (names only)
        id: config
        env:
          BUILD_ENVIRONMENT: development-build
          WORKFLOW: deploy-dev.yml
          HAS_VITE_CHAIN_ID: ${{ vars.VITE_CHAIN_ID != '' }}
          HAS_VITE_RPC_URL: ${{ vars.VITE_RPC_URL != '' }}
          HAS_VITE_BUNDLER_URL: ${{ secrets.VITE_BUNDLER_URL != '' }}
          HAS_VITE_SPONSORSHIP_POLICY_ID: ${{ vars.VITE_SPONSORSHIP_POLICY_ID != '' }}
          HAS_VITE_TURBO_UPLOAD_URL: ${{ vars.VITE_TURBO_UPLOAD_URL != '' }}
          HAS_VITE_ARWEAVE_GATEWAY_URL: ${{ vars.VITE_ARWEAVE_GATEWAY_URL != '' }}
          HAS_VITE_RP_ID: ${{ vars.VITE_RP_ID != '' }}
          HAS_VITE_RP_NAME: ${{ vars.VITE_RP_NAME != '' }}
        run: .github/scripts/deploy/check-config.sh

  test:
    name: test
    needs: [detect, config]
    if: needs.detect.outputs.deploy == 'true' && needs.config.outputs.configured == 'true'
    uses: ./.github/workflows/ci.yml # not `$/...`: actionlint 1.7.12 rejects it (rhysd/actionlint#711); zizmor ignore in .github/zizmor.yml
    with:
      full: true
    permissions:
      contents: read # the called CI checks out code
      pull-requests: read # the most any called job declares (its PR path filter, skipped here)

  # Runs all build code (pnpm, vite, plugins) WITHOUT the Fly token: DEPLOY_TARGET=development deploy.sh --build-only
  # performs every guard (clean tree, no exported VITE_*, RP ID == cryoshield-web-dev.fly.dev and never the production RP ID,
  # two identical builds, bundle checks) and writes deploy/.build (site, noindex Caddyfile, release manifest).
  build:
    name: build
    needs: [detect, config, test]
    if: needs.detect.outputs.deploy == 'true' && needs.config.outputs.configured == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: development-build # build config only; never the Fly token
    permissions:
      contents: read # checkout only
    steps:
      - name: Checkout the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.detect.outputs.sha }}
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      # No analytics on dev: the Cloudflare beacon token is never passed here (enforced by workflow-policy.mjs, ECC M2).
      - name: Write apps/web/.env from the development-build environment
        id: web-env
        env:
          VITE_CHAIN_ID: ${{ vars.VITE_CHAIN_ID }}
          VITE_RPC_URL: ${{ vars.VITE_RPC_URL }}
          VITE_BUNDLER_URL: ${{ secrets.VITE_BUNDLER_URL }}
          VITE_SPONSORSHIP_POLICY_ID: ${{ vars.VITE_SPONSORSHIP_POLICY_ID }}
          VITE_TURBO_UPLOAD_URL: ${{ vars.VITE_TURBO_UPLOAD_URL }}
          VITE_ARWEAVE_GATEWAY_URL: ${{ vars.VITE_ARWEAVE_GATEWAY_URL }}
          VITE_ARWEAVE_FAST_INDEX_URL: ${{ vars.VITE_ARWEAVE_FAST_INDEX_URL }}
          VITE_RP_ID: ${{ vars.VITE_RP_ID }}
          VITE_RP_NAME: ${{ vars.VITE_RP_NAME }}
          BUILD_ENVIRONMENT: development-build
        run: .github/scripts/deploy/write-env.sh
      - name: Guarded build (DEPLOY_TARGET=development deploy.sh --build-only)
        id: build
        env:
          DEPLOY_TARGET: development
        run: apps/web/deploy/deploy.sh --build-only
      - name: Check the manifest names the tested commit
        env:
          SHA: ${{ needs.detect.outputs.sha }}
        run: |
          [ "$(jq -r .commit apps/web/deploy/.build/release-manifest.json)" = "$SHA" ] \
            || { echo "::error::release manifest commit differs from the tested commit"; exit 1; }
      - name: Upload the deploy context (site, Caddyfile, release manifest)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deploy-context-${{ needs.detect.outputs.sha }}
          path: apps/web/deploy/.build
          include-hidden-files: true # site/.well-known/security.txt
          if-no-files-found: error
          retention-days: 7 # the bundle (and its public bundler key) only needs to outlive the deploy

  # The ONLY job in environment `development`: right before deploying, skips if its commit is no longer main's HEAD;
  # otherwise deploys, smoke-tests and,
  # on failure or cancellation after `fly deploy` started, rolls back. It holds the dev Fly token and runs only flyctl,
  # curl, jq, gh and coreutils on the verified build artifact (enforced by workflow-policy.mjs).
  release:
    name: release
    needs: [detect, build]
    if: needs.detect.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: development
      url: https://cryoshield-web-dev.fly.dev
    concurrency:
      group: deploy-development
      cancel-in-progress: false
    permissions:
      contents: read # checkout, and the main HEAD check via the API
    steps:
      - name: Checkout (fly.dev.toml, Dockerfile, .dockerignore, deploy scripts, deployment records, donation config)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.detect.outputs.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/deploy
            apps/web/fly.dev.toml
            apps/web/.dockerignore
            apps/web/deploy/Dockerfile
            contracts/deployments
            config/donation.json
          sparse-checkout-cone-mode: false
      - name: Download the deploy context built without the token
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deploy-context-${{ needs.detect.outputs.sha }}
          path: apps/web/deploy/.build
      - name: Verify the context against its release manifest
        env:
          SHA: ${{ needs.detect.outputs.sha }}
        run: |
          set -euo pipefail
          m=apps/web/deploy/.build/release-manifest.json
          [ "$(jq -r .commit "$m")" = "$SHA" ] || { echo "::error::manifest commit differs from the tested commit"; exit 1; }
          tree="sha256:$(cd apps/web/deploy/.build/site && find . -type f ! -path ./release.json | sed 's#^\./##' | LC_ALL=C sort \
            | while IFS= read -r f; do sha256sum "$f"; done | sha256sum | cut -d' ' -f1)"
          [ "$tree" = "$(jq -r .treeHash "$m")" ] || { echo "::error::site tree hash $tree differs from the manifest"; exit 1; }
          [ "$(jq -r .commit apps/web/deploy/.build/site/release.json)" = "$SHA" ] || { echo "::error::release.json names another commit"; exit 1; }
          caddy="sha256:$(sha256sum apps/web/deploy/.build/Caddyfile | cut -d' ' -f1)"
          [ "$caddy" = "$(jq -r .caddyfile "$m")" ] || { echo "::error::Caddyfile hash $caddy differs from the manifest"; exit 1; }
          # Integrity only: a compromised build could forge a consistent manifest. Residual risk, design.md (ECC #5).
      - name: Install flyctl (pinned, checksum-verified)
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/flyctl.tar.gz" \
            "https://github.com/superfly/flyctl/releases/download/v${FLYCTL_VERSION}/flyctl_${FLYCTL_VERSION}_Linux_x86_64.tar.gz"
          echo "${FLYCTL_SHA256}  ${RUNNER_TEMP}/flyctl.tar.gz" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/fly-bin"
          tar -xzf "${RUNNER_TEMP}/flyctl.tar.gz" -C "${RUNNER_TEMP}/fly-bin" flyctl
          ln -sf flyctl "${RUNNER_TEMP}/fly-bin/fly"
          echo "${RUNNER_TEMP}/fly-bin" >> "${GITHUB_PATH}"
      # Right before fly deploy (ECC L1): an older commit whose release queued behind a newer one must not roll the dev
      # site back (security review M1). Superseded is not a failure: the run ends green with a notice, deploying nothing.
      - name: Skip a release that is no longer main's HEAD
        id: head-check
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.detect.outputs.sha }}
        run: |
          set -euo pipefail
          head="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          if [ "$head" != "$SHA" ]; then
            echo "::notice title=Superseded::main moved on to ${head}; this dev release (${SHA}) is stale and was not deployed. The newer run deploys main."
            echo "current=false" >> "${GITHUB_OUTPUT}"
          else
            echo "current=true" >> "${GITHUB_OUTPUT}"
          fi
      # Record the live image (rollback target), then deploy.
      - name: Deploy the built context (flyctl only)
        id: deploy
        if: steps.head-check.outputs.current == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          APP: ${{ env.FLY_APP }}
          DEPLOY_ENVIRONMENT: development
        run: |
          set -euo pipefail
          .github/scripts/deploy/previous-image.sh
          echo "fly_started=true" >> "${GITHUB_OUTPUT}"
          cd apps/web
          fly deploy --config "$FLY_CONFIG" --remote-only --app "$FLY_APP"
      - name: Record the release in the job summary
        if: steps.head-check.outputs.current == 'true'
        run: |
          set -euo pipefail
          m=apps/web/deploy/.build/release-manifest.json
          {
            echo "### Deployed ${SITE_URL} (development)"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| commit | \`$(jq -r .commit "$m")\` |"
            echo "| treeHash | \`$(jq -r .treeHash "$m")\` |"
            echo "| chain | \`$(jq -r .config.chainId "$m")\` |"
            echo "| rpId | \`$(jq -r .config.rpId "$m")\` |"
            echo "| registry v2 | \`$(jq -r .config.registryV2.address "$m")\` |"
            echo "| wallet factory | \`$(jq -r .config.wallet.factory "$m")\` |"
            echo ""
            echo "Release manifest: artifact \`deploy-context-$(jq -r .commit "$m")\`."
          } >> "${GITHUB_STEP_SUMMARY}"
      # Chain and registry come from the verified manifest and the deployment record at the same commit.
      - name: Smoke test the live site
        id: smoke
        if: steps.head-check.outputs.current == 'true'
        env:
          EXPECT_SHA: ${{ needs.detect.outputs.sha }}
          BASE_URL: ${{ env.SITE_URL }}
          EXPECT_NOINDEX: "true"
        run: |
          set -euo pipefail
          m=apps/web/deploy/.build/release-manifest.json
          chain="$(jq -r .config.chainId "$m")"
          [[ "$chain" =~ ^[0-9]+$ ]] || { echo "::error::manifest chainId is not a chain id"; exit 1; }
          rec="contracts/deployments/${chain}.json"
          rp="$(jq -r .config.rpId "$m")"
          # harden-gas-sponsorship: registry v2 and this RP ID's wallet factory always; v1 only where the record has it.
          # smoke.sh checks each against the live /release.json and /architecture.
          REGISTRY_V2_ADDRESS="$(jq -r '.contracts.vaultRegistryV2.address // empty' "$rec")"
          WALLET_FACTORY_ADDRESS="$(jq -r --arg rp "$rp" '.contracts.wallets[$rp].factory // empty' "$rec")"
          REGISTRY_ADDRESS="$(jq -r '.address // empty' "$rec")"
          export REGISTRY_V2_ADDRESS WALLET_FACTORY_ADDRESS REGISTRY_ADDRESS
          DONATION_ADDRESS="$(jq -r .address config/donation.json)"
          [[ "$DONATION_ADDRESS" =~ ^0x[0-9a-fA-F]{40}$ ]] || { echo "::error::config/donation.json .address is not 0x + 40 hex (got '${DONATION_ADDRESS}'); is the file in the sparse checkout?"; exit 1; }
          export DONATION_ADDRESS
          .github/scripts/deploy/smoke.sh
      # Same job: also on cancellation after `fly deploy` started. Uses the NEW commit's fly.dev.toml with the previous
      # image (docs/deploy.md -> Rollback, review L1).
      - name: Roll back to the previous release
        id: rollback
        if: (failure() || cancelled()) && steps.deploy.outputs.fly_started == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          PREVIOUS_IMAGE: ${{ steps.deploy.outputs.previous_image }}
          APP: ${{ env.FLY_APP }}
          CONFIG: apps/web/${{ env.FLY_CONFIG }}
          BASE_URL: ${{ env.SITE_URL }}
        run: .github/scripts/deploy/rollback.sh
      - name: Fail loudly
        if: failure() || cancelled()
        env:
          SHA: ${{ needs.detect.outputs.sha }}
          DEPLOY: ${{ steps.deploy.outcome }}
          SMOKE: ${{ steps.smoke.outcome }}
          ROLLBACK: ${{ steps.rollback.outcome }}
        run: |
          {
            echo "### Dev release of \`$SHA\` FAILED"
            echo ""
            echo "deploy: **${DEPLOY:-not run}**, smoke test: **${SMOKE:-not run}**, automatic rollback: **${ROLLBACK:-not attempted}**."
            echo "This commit will not be retried automatically; fix forward, or see docs/deploy.md -> Rollback."
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "::error title=deploy::The dev release of $SHA failed (deploy: ${DEPLOY:-not run}, smoke: ${SMOKE:-not run}, rollback: ${ROLLBACK:-not attempted})."
          exit 1
