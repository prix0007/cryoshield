# zizmor configuration (OpenSpec changes add-ci, adopt-ecc-review-and-auto-merge, add-continuous-deploy).
# Run: uvx zizmor==1.30.1 --offline --persona=pedantic --config .github/zizmor.yml .github
rules:
  unpinned-uses:
    config:
      policies:
        # Every action, first-party ones included, must be pinned to a full commit SHA.
        "*": hash-pin
  # Accepted finding 1: the `on:` line of the two privileged workflows, which need pull_request_target
  # to run from main (adopt-ecc-review-and-auto-merge, design decision 1). Pinned to file:line so any other use,
  # or a moved trigger, is reported again. Their guards (fork refusal, no PR code executed, scoped write
  # permissions) are enforced by .github/scripts/workflow-policy.mjs, which allows no other ignore here.
  dangerous-triggers:
    ignore:
      - ecc-review.yml:31
      - auto-merge.yml:19
  # Accepted finding 2: deploy.yml's reusable-CI call uses `./.github/workflows/ci.yml` because the CI-pinned
  # actionlint 1.7.12 rejects GitHub's newer `$/` self-repository syntax (rhysd/actionlint#711). Pinned to
  # file:line (add-continuous-deploy D4); workflow-policy.mjs requires it to be exactly that call line (ECC #8).
  # Drop it once actionlint supports `$/`.
  self-repository:
    ignore:
      - deploy.yml:84
